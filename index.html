<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enregistreur + Bookmarks</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    button { padding: 15px 20px; margin: 8px 4px; font-size: 17px; width: 100%; max-width: 420px; }
    .status { margin: 15px 0; padding: 10px; background: #e0f0ff; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>🎙️ Enregistreur avec Bookmarks</h1>
  
  <button id="recordBtn">▶️ Démarrer l'enregistrement</button>
  <button id="stopBtn" disabled>⏹️ Arrêter</button>
  <button id="bookmarkBtn" disabled>📍 Ajouter Bookmark</button>
  
  <p>Temps : <strong><span id="timer">00:00</span></strong></p>
  <div class="status" id="status">Prêt</div>
  
  <audio id="player" controls style="width:100%; margin:15px 0;"></audio>
  
  <h2>📌 Bookmarks</h2>
  <ul id="bookmarkList"></ul>
  
  <button id="splitBtn" disabled>✂️ Découper et télécharger ZIP</button>

  <script>
    let mediaRecorder, stream, fullAudioBlob;
    let bookmarks = [];
    let startTime, timerInterval;
    let chunks = [];
    let isRecording = false;

    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const bookmarkBtn = document.getElementById('bookmarkBtn');
    const splitBtn = document.getElementById('splitBtn');
    const player = document.getElementById('player');
    const bookmarkList = document.getElementById('bookmarkList');
    const timerEl = document.getElementById('timer');
    const statusEl = document.getElementById('status');

    function log(msg) {
      console.log(msg);
      statusEl.textContent = msg;
    }

    recordBtn.onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: true, noiseSuppression: true } 
        });
        
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
        chunks = [];
        bookmarks = [];
        bookmarkList.innerHTML = '';

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = () => {
          fullAudioBlob = new Blob(chunks, { type: 'audio/webm' });
          player.src = URL.createObjectURL(fullAudioBlob);
          splitBtn.disabled = false;
          log("Enregistrement terminé.");
        };

        mediaRecorder.start(500);
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 200);
        isRecording = true;

        recordBtn.disabled = true;
        stopBtn.disabled = false;
        bookmarkBtn.disabled = false;
        log("Enregistrement en cours...");
      } catch (err) {
        log("Erreur : " + err.message);
      }
    };

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      timerEl.textContent = `${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`;
    }

    bookmarkBtn.onclick = () => {
      if (!isRecording) return;
      const timeSec = Math.floor((Date.now() - startTime) / 1000);
      bookmarks.push({ time: timeSec, label: `Bookmark ${bookmarks.length + 1}` });
      renderBookmarks();
      log(`Bookmark ajouté à ${Math.floor(timeSec/60)}:${(timeSec%60).toString().padStart(2,'0')}`);
    };

    function renderBookmarks() {
      bookmarkList.innerHTML = '';
      bookmarks.forEach((b, i) => {
        const min = Math.floor(b.time/60);
        const sec = (b.time%60).toString().padStart(2,'0');
        const li = document.createElement('li');
        li.style.padding = "12px";
        li.style.background = "#f0f0f0";
        li.style.margin = "6px 0";
        li.style.borderRadius = "6px";
        li.innerHTML = `${b.label} — ${min}:${sec} <button onclick="removeBookmark(${i})" style="float:right;color:red;">×</button>`;
        bookmarkList.appendChild(li);
      });
    }

    window.removeBookmark = (i) => {
      bookmarks.splice(i, 1);
      renderBookmarks();
    };

    stopBtn.onclick = () => {
      if (mediaRecorder) mediaRecorder.stop();
      if (stream) stream.getTracks().forEach(t => t.stop());
      clearInterval(timerInterval);
      isRecording = false;
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      bookmarkBtn.disabled = true;
    };

    // ====================== EXPORT ZIP ======================
    splitBtn.onclick = async () => {
      if (!fullAudioBlob || bookmarks.length === 0) {
        alert("Ajoutez au moins un bookmark !");
        return;
      }

      log("Découpage en cours...");

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const arrayBuffer = await fullAudioBlob.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const zip = new JSZip();
        let previousTime = 0;

        // Segments avec bookmarks
        for (let i = 0; i < bookmarks.length; i++) {
          const current = bookmarks[i].time;
          const startSample = Math.floor(previousTime * audioBuffer.sampleRate);
          const endSample = Math.floor(current * audioBuffer.sampleRate);

          const segment = audioCtx.createBuffer(audioBuffer.numberOfChannels, endSample - startSample, audioBuffer.sampleRate);
          
          for (let ch = 0; ch < audioBuffer.numberOfChannels; ch++) {
            segment.copyToChannel(audioBuffer.getChannelData(ch).subarray(startSample, endSample), ch);
          }

          const wavBlob = audioBufferToWav(segment);
          zip.file(`${i}.mp3`, wavBlob);   // ← Nommage demandé : 0.mp3, 1.mp3, ...

          previousTime = current;
        }

        // Dernier segment
        if (previousTime < audioBuffer.duration) {
          const startSample = Math.floor(previousTime * audioBuffer.sampleRate);
          const segment = audioCtx.createBuffer(audioBuffer.numberOfChannels, audioBuffer.length - startSample, audioBuffer.sampleRate);
          
          for (let ch = 0; ch < audioBuffer.numberOfChannels; ch++) {
            segment.copyToChannel(audioBuffer.getChannelData(ch).subarray(startSample), ch);
          }
          
          const wavBlob = audioBufferToWav(segment);
          zip.file(`final.mp3`, wavBlob);
        }

        const zipBlob = await zip.generateAsync({ type: "blob" });
        const url = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `enregistrement_segments.zip`;
        a.click();
        URL.revokeObjectURL(url);

        log("✅ ZIP téléchargé avec succès !");
      } catch (err) {
        console.error(err);
        log("Erreur : " + err.message);
      }
    };

    function audioBufferToWav(buffer) {
      // ... (même fonction que précédemment - inchangée)
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1;
      const bitDepth = 16;
      const bytesPerSample = bitDepth / 8;
      const blockAlign = numChannels * bytesPerSample;
      const dataSize = buffer.length * blockAlign;
      const bufferSize = 44 + dataSize;

      const arrayBuffer = new ArrayBuffer(bufferSize);
      const view = new DataView(arrayBuffer);

      const writeString = (v, offset, str) => {
        for (let i = 0; i < str.length; i++) v.setUint8(offset + i, str.charCodeAt(i));
      };

      writeString(view, 0, 'RIFF');
      view.setUint32(4, bufferSize - 8, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, format, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitDepth, true);
      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < buffer.length; i++) {
        for (let ch = 0; ch < numChannels; ch++) {
          const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
          view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
          offset += 2;
        }
      }
      return new Blob([arrayBuffer], { type: 'audio/wav' });
    }
  </script>
</body>
</html>
