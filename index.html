<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enregistreur Mobile avec Bookmarks</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; padding: 0; }
    button { padding: 15px 20px; margin: 8px 4px; font-size: 17px; width: 100%; max-width: 400px; }
    .red { background: #f44; color: white; }
    ul { padding: 0; }
    li { padding: 12px; background: #f0f0f0; margin: 8px 0; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🎙️ Enregistreur + Bookmarks</h1>
  
  <button id="recordBtn">▶️ Démarrer l'enregistrement</button>
  <button id="stopBtn" disabled>⏹️ Arrêter l'enregistrement</button>
  <button id="bookmarkBtn" disabled>📍 Ajouter Bookmark maintenant</button>
  
  <p>Temps : <strong><span id="timer">00:00</span></strong></p>
  
  <audio id="player" controls style="width:100%; margin:15px 0;"></audio>
  
  <h2>📌 Bookmarks</h2>
  <ul id="bookmarkList"></ul>
  
  <button id="splitBtn" disabled>✂️ Découper tous les segments + ZIP</button>

  <script>
    let mediaRecorder, stream, audioContext, fullAudioBlob;
    let bookmarks = [];
    let startTime, timerInterval;
    let chunks = [];

    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const bookmarkBtn = document.getElementById('bookmarkBtn');
    const splitBtn = document.getElementById('splitBtn');
    const player = document.getElementById('player');
    const bookmarkList = document.getElementById('bookmarkList');
    const timerEl = document.getElementById('timer');

    async function startRecording() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: true, noiseSuppression: true } 
        });
        
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
        chunks = [];
        bookmarks = [];
        bookmarkList.innerHTML = '';

        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = () => {
          fullAudioBlob = new Blob(chunks, { type: 'audio/webm' });
          player.src = URL.createObjectURL(fullAudioBlob);
          splitBtn.disabled = false;
        };

        mediaRecorder.start(1000); // timeslice pour meilleure compatibilité mobile
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 200);

        recordBtn.disabled = true;
        stopBtn.disabled = false;
        bookmarkBtn.disabled = false;
      } catch (err) {
        alert("Impossible d'accéder au micro.\n\n" + err.message + "\n\nEssaie sur HTTPS ou autorise le micro dans les paramètres du navigateur.");
      }
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      timerEl.textContent = `${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`;
    }

    recordBtn.onclick = startRecording;

    bookmarkBtn.onclick = () => {
      const timeSec = Math.floor((Date.now() - startTime) / 1000);
      const label = prompt("Nom du bookmark :", `Segment ${bookmarks.length + 1}`);
      bookmarks.push({ time: timeSec, label: label || `Bookmark ${bookmarks.length + 1}` });
      renderBookmarks();
    };

    function renderBookmarks() {
      bookmarkList.innerHTML = '';
      bookmarks.forEach((b, i) => {
        const li = document.createElement('li');
        li.innerHTML = `${b.label} — ${Math.floor(b.time/60)}:${(b.time%60).toString().padStart(2,'0')} 
          <button onclick="removeBookmark(${i})" style="float:right;">×</button>`;
        bookmarkList.appendChild(li);
      });
    }

    window.removeBookmark = (i) => {
      bookmarks.splice(i, 1);
      renderBookmarks();
    };

    stopBtn.onclick = () => {
      if (mediaRecorder) mediaRecorder.stop();
      if (stream) stream.getTracks().forEach(t => t.stop());
      clearInterval(timerInterval);
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      bookmarkBtn.disabled = true;
    };

    // Le reste du code (audioBufferToWav + splitBtn) est identique à la version précédente
    // (je l’ai gardé court ici — dis-moi si tu veux le script complet mis à jour)
  </script>
</body>
</html>
