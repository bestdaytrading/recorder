<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="media-src 'self' blob: data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enregistreur + Bluetooth Mic</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    button, select { padding: 12px 16px; margin: 8px 4px; font-size: 16px; width: 100%; max-width: 420px; }
    .status { margin: 15px 0; padding: 12px; background: #e0f0ff; border-radius: 8px; }
    button:disabled { opacity: 0.5; }
    .segment-item { padding: 12px; background: #f0f0f0; margin: 6px 0; border-radius: 6px; }
    .segment-item audio { width: 100%; margin-top: 8px; }
    .segment-label { font-weight: bold; }
  </style>
</head>
<body>
  <h1>🎙️ Enregistreur (Bluetooth OK)</h1>

  <label>Microphone :</label><br>
  <select id="micSelect"></select><br><br>
  <label style="display:flex; align-items:center; gap:8px; max-width:420px;">
    <input type="checkbox" id="rawModeCheckbox" style="width:auto;" checked>
    Mode qualité brute (recommandé pour micro externe ; à décocher seulement si un Bluetooth reste muet)
  </label><br>

  <button id="refreshBtn">🔄 Rafraîchir liste micros</button>
  <button id="recordBtn">▶️ Démarrer l'enregistrement</button>
  <button id="stopBtn" disabled>⏹️ Arrêter</button>
  <button id="bookmarkBtn" disabled>📍 Ajouter Bookmark</button>

  <p>Temps : <strong><span id="timer">00:00</span></strong></p>
  <div class="status" id="status">Prêt</div>

  <h2>📌 Bookmarks (pendant l'enregistrement)</h2>
  <ul id="bookmarkList"></ul>

  <h2>🎧 Segments (après arrêt)</h2>
  <p style="font-size:14px;color:#555;">Écoute chaque segment ici avant de télécharger — c'est la garantie qu'il n'est pas vide.</p>
  <ul id="segmentsList"></ul>

  <button id="splitBtn" disabled>✂️ Télécharger ZIP (0.webm, 1.webm...)</button>

  <script>
    // Variables globales
    let stream;
    let segmentRecorder, segmentChunks = [];
    let segmentBlobs = []; // each entry = one native, precisely-cut webm segment
    let bookmarks = []; // live display only, during recording
    let startTime, timerInterval;
    let isRecording = false;
    let isFinalizing = false;
    let isSwitchingSegment = false;
    let currentDeviceId = null;

    const micSelect = document.getElementById('micSelect');
    const refreshBtn = document.getElementById('refreshBtn');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const bookmarkBtn = document.getElementById('bookmarkBtn');
    const splitBtn = document.getElementById('splitBtn');
    const bookmarkList = document.getElementById('bookmarkList');
    const segmentsList = document.getElementById('segmentsList');
    const timerEl = document.getElementById('timer');
    const statusEl = document.getElementById('status');

    function log(msg) {
      console.log(msg);
      statusEl.textContent = msg;
    }

    // Charger la liste des microphones
    async function loadMicrophones() {
      try {
        const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        tempStream.getTracks().forEach(t => t.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const mics = devices.filter(d => d.kind === 'audioinput');

        micSelect.innerHTML = '';
        mics.forEach(mic => {
          const option = document.createElement('option');
          option.value = mic.deviceId;
          option.textContent = mic.label || `Micro ${mic.deviceId.slice(0,8)}...`;
          micSelect.appendChild(option);
        });

        if (mics.length > 0) currentDeviceId = mics[0].deviceId;
        log(`${mics.length} micro(s) détecté(s)`);
      } catch (err) {
        log("Erreur chargement micros : " + err.message);
      }
    }

    refreshBtn.onclick = loadMicrophones;

    // Démarrer enregistrement avec le micro sélectionné
    recordBtn.onclick = async () => {
      try {
        const rawMode = document.getElementById('rawModeCheckbox').checked;

        const constraints = {
          audio: {
            deviceId: currentDeviceId ? { exact: currentDeviceId } : undefined,
            // En mode "qualité brute", on désactive tout le pipeline vocal
            // (écho/bruit/gain auto) : ces filtres sont pensés pour un appel
            // téléphonique et dégradent nettement un bon micro externe
            // (souvent en le repassant en mono basse fréquence). Un
            // Bluetooth muet peut aussi bénéficier de les désactiver.
            echoCancellation: !rawMode,
            noiseSuppression: !rawMode,
            autoGainControl: !rawMode,
            sampleRate: { ideal: 48000 },
            channelCount: { ideal: 1 }
          }
        };

        stream = await navigator.mediaDevices.getUserMedia(constraints);

        // Diagnostic : ce que le navigateur a réellement négocié avec le
        // périphérique (utile pour comprendre un souci de qualité ou de
        // silence — ex. le mic bascule sur 16 kHz malgré la demande).
        const track = stream.getAudioTracks()[0];
        if (track) {
          console.log("Paramètres audio négociés :", track.getSettings());
        }

        bookmarks = [];
        segmentBlobs = [];
        bookmarkList.innerHTML = '';
        segmentsList.innerHTML = '';
        splitBtn.disabled = true;
        isFinalizing = false;
        isSwitchingSegment = false;

        // Petite pause avant de démarrer l'enregistrement : un casque
        // Bluetooth a parfois besoin d'un instant pour basculer de son
        // profil "sortie audio" vers son profil "micro", sinon le tout
        // début (voire plus) est silencieux.
        log("Préparation du micro...");
        await new Promise(r => setTimeout(r, 600));

        // Un seul MediaRecorder actif à la fois sur le flux : c'est ce qui
        // garantit que l'audio n'est jamais vide. Avoir un deuxième
        // recorder (ex. pour une prévisualisation live) en parallèle
        // provoquait un silence sur l'un des deux flux enregistrés.
        startNewSegment();

        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 200);
        isRecording = true;

        recordBtn.disabled = true;
        stopBtn.disabled = false;
        bookmarkBtn.disabled = false;
        log("Enregistrement en cours avec : " + (micSelect.options[micSelect.selectedIndex]?.textContent || "micro sélectionné"));
      } catch (err) {
        log("Erreur : " + err.message);
        alert("Impossible d'utiliser ce micro. Essaie d'en sélectionner un autre.");
      }
    };

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      timerEl.textContent = `${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`;
    }

    function startNewSegment() {
      segmentChunks = [];
      // audioBitsPerSecond explicite : le défaut du navigateur est souvent
      // assez conservateur et peut sur-compresser un micro externe propre.
      segmentRecorder = new MediaRecorder(stream, {
        mimeType: 'audio/webm;codecs=opus',
        audioBitsPerSecond: 192000
      });
      segmentRecorder.ondataavailable = e => { if (e.data.size > 0) segmentChunks.push(e.data); };
      segmentRecorder.onstop = () => {
        const blob = new Blob(segmentChunks, { type: 'audio/webm' });
        segmentBlobs.push(blob);
        console.log(`Segment ${segmentBlobs.length - 1} : ${blob.size} octets`);
        if (isFinalizing) {
          renderSegments();
          splitBtn.disabled = segmentBlobs.length === 0;
          log(`Enregistrement terminé — ${segmentBlobs.length} segment(s). Écoute-les ci-dessous avant de télécharger.`);
        } else {
          // On ne démarre le segment suivant qu'une fois celui-ci
          // complètement fermé (onstop déjà déclenché) : le faire plus tôt
          // laissait deux MediaRecorder actifs en même temps sur le même
          // flux, ce qui coupait le son de l'un des deux.
          startNewSegment();
          isSwitchingSegment = false;
          bookmarkBtn.disabled = false;
        }
      };
      segmentRecorder.start(500);
    }

    bookmarkBtn.onclick = () => {
      if (!isRecording || !segmentRecorder || isSwitchingSegment) return;
      const timeSec = Math.floor((Date.now() - startTime) / 1000);
      bookmarks.push({ time: timeSec });
      renderBookmarks();
      log(`Bookmark ajouté à ${Math.floor(timeSec/60)}:${(timeSec%60).toString().padStart(2,'0')} — clôture du segment...`);
      isSwitchingSegment = true;
      bookmarkBtn.disabled = true;
      // Déclenche segmentRecorder.onstop ci-dessus, qui démarre le segment
      // suivant une fois celui-ci vraiment fermé.
      segmentRecorder.stop();
    };

    function renderBookmarks() {
      bookmarkList.innerHTML = '';
      bookmarks.forEach((b, i) => {
        const min = Math.floor(b.time/60);
        const sec = (b.time%60).toString().padStart(2,'0');
        const li = document.createElement('li');
        li.style.padding = "8px";
        li.style.background = "#f0f0f0";
        li.style.margin = "4px 0";
        li.style.borderRadius = "6px";
        li.textContent = `Bookmark ${i} — ${min}:${sec} (ferme le segment ${i})`;
        bookmarkList.appendChild(li);
      });
    }

    function renderSegments() {
      segmentsList.innerHTML = '';
      segmentBlobs.forEach((blob, i) => {
        const isLast = i === segmentBlobs.length - 1;
        const name = isLast ? 'final' : String(i);
        const li = document.createElement('li');
        li.className = 'segment-item';

        const label = document.createElement('div');
        label.className = 'segment-label';
        label.textContent = `Segment ${name}.webm — ${(blob.size / 1024).toFixed(1)} Ko`;
        li.appendChild(label);

        const audioEl = document.createElement('audio');
        audioEl.controls = true;
        audioEl.src = URL.createObjectURL(blob);
        li.appendChild(audioEl);

        segmentsList.appendChild(li);
      });
    }

    stopBtn.onclick = () => {
      isFinalizing = true;
      if (segmentRecorder) segmentRecorder.stop(); // finalise le dernier segment
      if (stream) stream.getTracks().forEach(t => t.stop());
      clearInterval(timerInterval);
      isRecording = false;
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      bookmarkBtn.disabled = true;
    };

    // ---------- Téléchargement : export direct des segments natifs ----------
    // On n'essaie pas de décoder/ré-encoder en mp3 : decodeAudioData()
    // (l'API Web Audio) est connue pour échouer sur des blobs produits par
    // MediaRecorder, surtout sur des segments courts, à cause d'un en-tête
    // webm incomplet. On zippe donc directement les segments natifs .webm
    // (Opus) — le même type de blob que tu viens d'écouter ci-dessus.
    splitBtn.onclick = async () => {
      if (!segmentBlobs.length) {
        log("Aucun segment à télécharger.");
        return;
      }
      splitBtn.disabled = true;
      try {
        const zip = new JSZip();
        const segmentCount = segmentBlobs.length;

        for (let i = 0; i < segmentCount; i++) {
          const filename = (i === segmentCount - 1) ? 'final.webm' : `${i}.webm`;
          zip.file(filename, segmentBlobs[i]);
        }

        log("Création du ZIP...");
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'segments.zip';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        log(`ZIP téléchargé ! (${segmentCount} fichier(s) .webm)`);
      } catch (err) {
        console.error(err);
        log("Erreur lors du téléchargement : " + err.message);
      } finally {
        splitBtn.disabled = false;
      }
    };

    // Chargement initial
    window.onload = () => {
      loadMicrophones();
      micSelect.onchange = () => currentDeviceId = micSelect.value;
    };
  </script>
</body>
</html>
